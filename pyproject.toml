[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echoes-transcribe"
dynamic = ["version"]
description = "Transcribe interviews and meetings with speaker labels and timestamps (faster-whisper + pyannote.audio)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Lecae" }]
requires-python = ">=3.10"
keywords = ["transcription", "diarization", "speaker", "whisper", "pyannote", "speech-to-text"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
echoes = "echoes.cli:main"

[project.urls]
Homepage = "https://github.com/kheinzz/echoes"
Issues = "https://github.com/kheinzz/echoes/issues"

[tool.setuptools.dynamic]
version = { attr = "echoes.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
