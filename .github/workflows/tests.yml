name: tests

# Manual runs only: automatic runs on push and pull requests are disabled.
# To enable them again, add:
#   push:
#   pull_request:
on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The unit tests don't need the (heavy) ML dependencies
      - run: |
          pip install pytest
          pip install --no-deps -e .
      - run: pytest
